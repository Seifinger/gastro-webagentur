<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead-Dashboard – Gastro-Webagentur</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E📋%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e3e6ea;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2563eb;
    --sehr-hoch: #dc2626;
    --hoch: #ea580c;
    --mittel: #ca8a04;
    --niedrig: #16a34a;
    --pruefen: #6b7280;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 20px 8px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 16px; }

  .stats {
    display: flex;
    gap: 12px;
    padding: 0 20px 16px;
    flex-wrap: wrap;
  }
  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    min-width: 130px;
  }
  .stat .value { font-size: 1.5rem; font-weight: 700; }
  .stat .label { font-size: 0.8rem; color: var(--muted); }

  .hinweis {
    display: none;
    margin: 0 20px 16px;
    padding: 10px 14px;
    background: var(--card);
    border: 1px solid var(--border);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .hinweis a { color: var(--accent); font-weight: 600; }

  a.entwurf {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 600;
  }
  a.entwurf:hover { background: #1d4ed8; }

  .controls {
    display: flex;
    gap: 10px;
    padding: 0 20px 16px;
    flex-wrap: wrap;
  }
  .controls input, .controls select {
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    background: var(--card);
    color: var(--text);
  }

  .table-wrap {
    margin: 0 20px 40px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: auto;
  }
  table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
  th, td {
    padding: 10px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    position: sticky;
    top: 0;
    background: var(--card);
    cursor: pointer;
    user-select: none;
    color: var(--muted);
    font-weight: 600;
  }
  th:hover { color: var(--text); }
  tr:hover td { background: #fafbfc; }

  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    color: white;
    font-size: 0.78rem;
    font-weight: 600;
    white-space: nowrap;
  }
  .badge.sehr-hoch { background: var(--sehr-hoch); }
  .badge.hoch { background: var(--hoch); }
  .badge.mittel { background: var(--mittel); }
  .badge.niedrig { background: var(--niedrig); }
  .badge.pruefen { background: var(--pruefen); }

  .yn { font-size: 1rem; }
  .yn.yes { color: var(--niedrig); }
  .yn.no { color: var(--sehr-hoch); }
  .yn.unknown { color: var(--muted); }

  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
  }

  a { color: var(--accent); }
</style>
</head>
<body>

<header>
  <h1>📋 Lead-Dashboard</h1>
  <div class="subtitle">Restaurant-Leads aus data/output/, sortiert nach Priorität</div>
</header>

<div class="stats" id="stats"></div>
<div class="hinweis" id="entwurfHinweis"></div>

<div class="controls">
  <input id="search" type="text" placeholder="Suche nach Name...">
  <select id="filterOrt"><option value="">Alle Orte</option></select>
  <select id="filterPrioritaet"><option value="">Alle Prioritäten</option></select>
</div>

<div class="table-wrap">
  <table id="table">
    <thead>
      <tr>
        <th data-key="priorität">Priorität</th>
        <th data-key="score">Score</th>
        <th data-key="name">Name</th>
        <th data-key="entwurf">Entwurf</th>
        <th data-key="ort">Ort</th>
        <th data-key="adresse">Adresse</th>
        <th data-key="telefon">Telefon</th>
        <th data-key="website">Website</th>
        <th data-key="hatBestellfunktion">Bestellung</th>
        <th data-key="hatReservierungsfunktion">Reservierung</th>
        <th data-key="mobilFreundlich">Mobil</th>
        <th data-key="wirktVeraltet">Veraltet?</th>
        <th data-key="rating">Bewertung</th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
  <div class="empty" id="empty" style="display:none">
    Noch keine Leads gefunden. Führe zuerst <code>npm start</code> aus, um Daten zu erzeugen.
  </div>
</div>

<script>
let allLeads = [];
let sortKey = "score";
let sortDir = -1;

const priorityOrder = ["Sehr hoch (keine Website)", "Sehr hoch", "Hoch", "Mittel", "Niedrig", "Zu prüfen (Website nicht erreichbar)"];

function priorityClass(p) {
  if (!p) return "pruefen";
  if (p.startsWith("Sehr hoch")) return "sehr-hoch";
  if (p.startsWith("Hoch")) return "hoch";
  if (p.startsWith("Mittel")) return "mittel";
  if (p.startsWith("Niedrig")) return "niedrig";
  return "pruefen";
}

function yn(value) {
  if (value === true) return '<span class="yn yes">✔</span>';
  if (value === false) return '<span class="yn no">✘</span>';
  return '<span class="yn unknown">–</span>';
}

function renderStats(leads) {
  const total = leads.length;
  const sehrHoch = leads.filter((l) => l.score >= 80).length;
  const ohneWebsite = leads.filter((l) => l.hatWebsite === false).length;
  const mitEntwurf = leads.filter((l) => l.entwurf).length;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><div class="value">${total}</div><div class="label">Leads gesamt</div></div>
    <div class="stat"><div class="value">${sehrHoch}</div><div class="label">Priorität "Sehr hoch"</div></div>
    <div class="stat"><div class="value">${ohneWebsite}</div><div class="label">ohne Website</div></div>
    <div class="stat"><div class="value">${mitEntwurf}</div><div class="label">Entwürfe erstellt</div></div>
  `;

  const hinweis = document.getElementById("entwurfHinweis");
  if (mitEntwurf === 0) {
    hinweis.textContent = "Noch keine Landing-Page-Entwürfe vorhanden – dafür einmal \"npm run pages\" ausführen und diese Seite neu laden.";
    hinweis.style.display = "block";
  } else if (mitEntwurf < total) {
    hinweis.innerHTML = `Für ${total - mitEntwurf} Lead(s) gibt es noch keinen Entwurf. <a href="/entwuerfe/" target="_blank" rel="noopener">Übersicht aller Entwürfe öffnen</a>`;
    hinweis.style.display = "block";
  } else {
    hinweis.innerHTML = `<a href="/entwuerfe/" target="_blank" rel="noopener">Übersicht aller Entwürfe öffnen</a>`;
    hinweis.style.display = "block";
  }
}

function populateFilters(leads) {
  const orte = [...new Set(leads.map((l) => l.ort).filter(Boolean))].sort();
  const prioritaeten = [...new Set(leads.map((l) => l.priorität).filter(Boolean))]
    .sort((a, b) => priorityOrder.indexOf(a) - priorityOrder.indexOf(b));

  const ortSelect = document.getElementById("filterOrt");
  orte.forEach((ort) => {
    const opt = document.createElement("option");
    opt.value = ort;
    opt.textContent = ort;
    ortSelect.appendChild(opt);
  });

  const prioSelect = document.getElementById("filterPrioritaet");
  prioritaeten.forEach((p) => {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    prioSelect.appendChild(opt);
  });
}

function applyFiltersAndRender() {
  const search = document.getElementById("search").value.toLowerCase();
  const ort = document.getElementById("filterOrt").value;
  const prioritaet = document.getElementById("filterPrioritaet").value;

  let filtered = allLeads.filter((l) =>
    (!search || (l.name || "").toLowerCase().includes(search)) &&
    (!ort || l.ort === ort) &&
    (!prioritaet || l.priorität === prioritaet)
  );

  filtered.sort((a, b) => {
    const av = a[sortKey] ?? "";
    const bv = b[sortKey] ?? "";
    if (typeof av === "number" || typeof bv === "number") return (av - bv) * sortDir;
    return String(av).localeCompare(String(bv)) * sortDir;
  });

  const tbody = document.getElementById("tbody");
  document.getElementById("empty").style.display = filtered.length ? "none" : "block";

  tbody.innerHTML = filtered.map((l) => `
    <tr>
      <td><span class="badge ${priorityClass(l.priorität)}">${l.priorität || "-"}</span></td>
      <td>${l.score ?? "-"}</td>
      <td>${l.name || ""}</td>
      <td>${l.entwurf ? `<a class="entwurf" href="${l.entwurf}" target="_blank" rel="noopener">ansehen</a>` : "-"}</td>
      <td>${l.ort || ""}</td>
      <td>${l.adresse || ""}</td>
      <td>${l.telefon || ""}</td>
      <td>${l.website ? `<a href="${l.website}" target="_blank" rel="noopener">öffnen</a>` : "-"}</td>
      <td>${yn(l.hatBestellfunktion)}</td>
      <td>${yn(l.hatReservierungsfunktion)}</td>
      <td>${yn(l.mobilFreundlich)}</td>
      <td>${yn(l.wirktVeraltet)}</td>
      <td>${l.rating ? `${l.rating} (${l.anzahlBewertungen || 0})` : "-"}</td>
    </tr>
  `).join("");
}

document.querySelectorAll("th[data-key]").forEach((th) => {
  th.addEventListener("click", () => {
    const key = th.dataset.key;
    sortDir = sortKey === key ? -sortDir : -1;
    sortKey = key;
    applyFiltersAndRender();
  });
});

["search", "filterOrt", "filterPrioritaet"].forEach((id) => {
  document.getElementById(id).addEventListener("input", applyFiltersAndRender);
});

fetch("/api/leads")
  .then((r) => r.json())
  .then((leads) => {
    allLeads = leads;
    renderStats(leads);
    populateFilters(leads);
    applyFiltersAndRender();
  });
</script>

</body>
</html>
