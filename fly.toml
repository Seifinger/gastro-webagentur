# Fly.io-Konfiguration für das Dashboard (Anleitung: docs-intern/HOSTING.md).
# app-Name und Region beim ersten "fly launch --no-deploy" anpassen.
app = "gastro-dashboard"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  DASHBOARD_HOST = "0.0.0.0"
  DASHBOARD_PORT = "8080"
  SITE_BASE_URL = "https://seifinger.github.io/gastro-webagentur"
  GITHUB_REPO = "Seifinger/gastro-webagentur"
  # Anmelde-Sperre je Besucher: die echte Adresse steht in Fly-Client-IP
  # (setzt der Fly-Proxy). Ohne diese Zeile teilen sich alle die Proxy-Adresse.
  VERTRAUTER_PROXY = "fly"

[[mounts]]
  source = "dashboard_daten"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # Eine Maschine, die weiterläuft: Veröffentlichungen laufen im Hintergrund
  # bis zu 15 Minuten, Sitzungen liegen im Speicher.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "120s"
    method = "GET"
    path = "/gesund"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
